name: build
on:
  push:
  pull_request:
jobs:
  jar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --no-daemon
      - run: bash -n deploy/linux.sh && python3 scripts/check-linux-sync.py
      - uses: actions/upload-artifact@v4
        with:
          name: SkyIslandSystem
          path: build/libs/*.jar
